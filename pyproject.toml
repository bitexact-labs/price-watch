[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "price-watch"
version = "0.1.0"
description = "Scrape a product catalog, keep price and stock history in SQLite, alert on changes in Telegram, export to Excel. No dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
pricewatch = "pricewatch.__main__:main"

[tool.setuptools]
packages = ["pricewatch"]
